<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts are linked here rather than @imported from CSS. An
         @import inside a stylesheet cannot start downloading until that
         stylesheet has been fetched and parsed, so it serialises the
         request behind the CSS and delays first paint. Linked here with
         preconnect, the font request starts in parallel with everything
         else. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Space+Mono:wght@400;700&display=swap"
    />

    <title>Festify — college fests, one ticket away</title>
    <meta
      name="description"
      content="Find and book college events across India — hackathons, cultural fests, concerts and sports. Real tickets, QR entry at the gate."
    />
    <meta name="theme-color" content="#16101F" />

    <!-- Ticket stub on the brand violet. The previous favicon still
         carried #083d44 from a palette that was replaced everywhere
         else. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236C4DFF'/><text y='.9em' font-size='72' x='12'>🎟</text></svg>"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Festify" />
    <meta property="og:title" content="Festify — college fests, one ticket away" />
    <meta
      property="og:description"
      content="Find and book college events across India — hackathons, cultural fests, concerts and sports."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
